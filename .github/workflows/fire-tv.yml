name: Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build Fire TV 4K Max 2023 (32-bit applications)
        run: |
          chmod +x gradlew
          ./gradlew :app:testLeanbackArmeabi_v7aDebugUnitTest :app:assembleLeanbackArmeabi_v7aDebug --stacktrace
      - name: Upload installable debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WebHomeTV-FireTV-4K-Max-2023-armeabi-v7a
          path: app/build/outputs/apk/leanbackArmeabi_v7a/debug/*.apk
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-tests
          path: app/build/reports/tests/
